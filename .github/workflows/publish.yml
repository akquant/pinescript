name: Publish @quanttrade/pinescript to GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package.json'
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@quanttrade'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Tests
        run: npm test

      - name: Build package
        run: npm run build

      - name: Publish to GitHub Packages
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
